apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streetwear-web-hpa
  namespace: streetwear-lab
  labels:
    app: streetwear-web
    app.kubernetes.io/part-of: udla-gitops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streetwear-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
