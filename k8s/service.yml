apiVersion: v1
kind: Service
metadata:
  name: streetwear-web
  namespace: streetwear-lab
  labels:
    app: streetwear-web
    app.kubernetes.io/part-of: udla-gitops
spec:
  type: NodePort
  selector:
    app: streetwear-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
