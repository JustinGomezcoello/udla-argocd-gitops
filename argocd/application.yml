apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streetwear-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JustinGomezcoello/udla-argocd-gitops.git
    targetRevision: main
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: streetwear-lab
  # El HPA es quien administra spec.replicas en tiempo de ejecución.
  # Sin esta exclusión, Argo CD revertiría cada escalado del HPA (bucle de reconciliación).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
